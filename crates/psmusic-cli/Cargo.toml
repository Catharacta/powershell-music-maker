[package]
name = "psmusic-cli"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "psmusic"
path = "src/main.rs"

[dependencies]
psmusic-core = { path = "../psmusic-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
